<!DOCTYPE HTML>
<html lang="" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Territories</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script type="text/javascript" th:src="@{/js/operations.js}"></script>
    </head>
    <body>
        <div>
            <h1>Territories</h1>
        </div>
        <div>
            <a href="/territories/new-territory"><button type="button" class="btn btn-primary">New territory</button></a>
        </div>
        <div>
            <table>
                <tr>
                    <th>Number</th>
                    <th>Doors</th>
                    <th>Assigned</th>
                    <th>Options</th>
                </tr>
                <tr th:each="territory : ${territoriesList}">
                    <td th:text="${territory.id}"></td>
                    <td th:text="${territory.doors}"></td>
                    <td>
                        <span th:if="${territory.lastAssigned > territory.lastReturned}">Yes</span>
                        <span th:unless="${territory.lastAssigned > territory.lastReturned}">No</span>
                    </td>
                    <td>
                        <button type="button" class="btn btn-danger" th:onclick="deleteById('territories', [[${territory.id}]])">Delete</button>
                        <a th:href="@{'territories/edit-territory/' + ${territory.id}}"><button type="button" class="btn btn-secondary">Edit</button></a>
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
